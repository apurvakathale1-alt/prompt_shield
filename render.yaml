services:
  - type: web
    name: promptshield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: ALLOWED_ORIGINS
        value: https://apurvakathale1-alt.github.io,http://localhost:5173,http://localhost:4173,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:4173,http://127.0.0.1:5175
